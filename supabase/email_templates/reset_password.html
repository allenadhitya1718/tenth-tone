<div style="margin:0;padding:24px;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px">

    <div style="font-size:20px;font-weight:700;color:#6c2bd9;margin-bottom:28px">FLYP</div>

    <div style="font-size:19px;font-weight:700;color:#16161c;margin-bottom:8px">Password reset code</div>
    <div style="font-size:15px;color:#5a5a66;line-height:1.7">Enter this code in the app to set a new password.</div>

    <div style="margin:26px 0;padding:20px;background:#f1ebff;border-radius:12px;text-align:center">
      <div style="font-size:34px;font-weight:700;letter-spacing:10px;color:#3d1580;font-family:'SF Mono',Menlo,Consolas,monospace">{{ .Token }}</div>
    </div>

    <div style="font-size:13.5px;color:#8a8a95;line-height:1.7">The code is valid for one hour. If you did not request a reset, ignore this email and your password will not change.</div>

    <div style="height:1px;background:#e8e6ef;margin:26px 0"></div>
    <div style="font-size:12px;color:#a5a4b0">FLYP</div>
  </div>
</div>
