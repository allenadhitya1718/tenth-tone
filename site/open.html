<script>
(function () {
  'use strict';

  // The App Store link needs the app's numeric id, which only exists once the
  // iOS app is live. Paste the full URL here (https://apps.apple.com/app/id...)
  // and the button goes straight to the store; while empty it opens /download.html.
  var APP_STORE_URL = '';
  var PLAY_URL = 'https://play.google.com/store/apps/details?id=com.flyp.app';
  var PACKAGE = 'com.flyp.app';

  var KINDS = {
    live: { app: 'live', ar: 'بث مباشر', en: 'Live',
            tAr: 'شاهد هذا البث المباشر في FLYP', tEn: 'Watch this live in FLYP' },
    v:    { app: 'v', ar: 'مقطع فيديو', en: 'Video',
            tAr: 'شاهد هذا المقطع في FLYP', tEn: 'Watch this video in FLYP' },
    u:    { app: 'u', ar: 'ملف شخصي', en: 'Profile',
            tAr: 'شاهد هذا الملف الشخصي في FLYP', tEn: 'See this profile in FLYP' }
  };

  // /live/<id>, /v/<id>, /u/<id>. Ids are UUIDs; anything else just opens the app.
  var m = location.pathname.match(/^\/(live|v|u)\/([0-9a-fA-F-]{36})\/?$/);
  var kind = m ? KINDS[m[1]] : null;
  var appPath = kind ? kind.app + '/' + m[2].toLowerCase() : '';

  function set(id, ar, en) {
    var el = document.getElementById(id);
    el.setAttribute('data-ar', ar);
    el.setAttribute('data-en', en);
  }
  if (kind) {
    set('open-kind', kind.ar, kind.en);
    set('open-title', kind.tAr, kind.tEn);
  }

  var ua = navigator.userAgent || '';
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);

  // Android: an intent URL opens the app if installed and otherwise falls back
  // to the Play Store, with no error page in between. Elsewhere the custom scheme.
  var openUrl = android
    ? 'intent://' + appPath + '#Intent;scheme=flyp;package=' + PACKAGE +
      ';S.browser_fallback_url=' + encodeURIComponent(PLAY_URL) + ';end'
    : 'flyp://' + appPath;
  document.getElementById('open-app').href = openUrl;

  var iosBtn = document.getElementById('get-ios');
  var andBtn = document.getElementById('get-android');
  if (APP_STORE_URL) iosBtn.href = APP_STORE_URL;
  // Show the store for this phone first; on a computer show both.
  if (ios) andBtn.hidden = true;
  if (android) iosBtn.hidden = true;

  // Try the app straight away on Android, where the intent falls back cleanly.
  // iOS Safari shows an "invalid address" alert for an unhandled scheme, so
  // there the visitor taps the button instead.
  if (android && kind) {
    setTimeout(function () { location.href = openUrl; }, 250);
  }
})();
</script>
