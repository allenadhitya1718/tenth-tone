plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.flyp.app'
version = '1.0.0'

android {
  namespace "expo.modules.flypfxcamera"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // EXACTLY the CameraX version react-native-vision-camera 5.2.3 pins
  // (node_modules/react-native-vision-camera/android/build.gradle), so Gradle
  // resolves a single copy of CameraX for the app.
  def camerax_version = "1.7.0-alpha03"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-video:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"

  // Same ML Kit artifact (bundled model) that react-native-vision-camera-face-detector
  // already pulls in, so there is one copy of the model in the APK.
  implementation "com.google.mlkit:face-detection:16.1.7"
}
