name: Build Android APK

# Builds a debug APK you can sideload for testing. Run it from the Actions
# tab, or let it run on every push to main. The APK appears as an artifact
# on the finished run.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'web/**'
      - 'android/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Capacitor 6 needs JDK 17. Newer JDKs fail the Gradle build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # ci needs a lockfile in step with package.json; install is tolerant
        # of the checked-in node_modules being stale or absent.
        run: npm install --no-audit --no-fund

      - name: Copy the web app into the Android project
        # sync also refreshes native plugin wiring, which matters whenever a
        # Capacitor plugin has been added or upgraded.
        run: npx cap sync android

      - name: Stamp the build number
        # Makes each artifact identifiable, so testers can tell you which
        # build they are on.
        run: |
          echo "Build ${{ github.run_number }} from ${GITHUB_SHA::7}" > web/BUILD_INFO.txt
          cat web/BUILD_INFO.txt

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename for clarity
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/TenthTone-build${{ github.run_number }}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: TenthTone-apk-build${{ github.run_number }}
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error
