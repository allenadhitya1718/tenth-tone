# Over-the-air update: sends the current JavaScript (screens, text, logic) to
# installed FLYP builds without a new APK or TestFlight build. Phones fetch
# it when the app opens and switch to it on the next launch.
#
# Builds only take updates whose native fingerprint matches their own
# (runtimeVersion policy "fingerprint", mobile/fingerprint.config.js). An
# update made after a native change (new library, permission, config plugin,
# app.json native fields) gets a new fingerprint, so older builds simply don't
# receive it and keep working; it reaches only builds made since that change.
# The job summary shows each update's fingerprint; the build workflows show
# theirs. If they differ, the update won't reach that build.
#
# Channels: the Android test APK listens on "preview"; the store builds
# (TestFlight and the Google Play AAB) on "production" (mobile/eas.json).
# Platforms are named one by one: the app has no web build (Agora is
# native-only), and the default "all" would try to bundle one.
name: OTA update

on:
  workflow_dispatch:
    inputs:
      channels:
        description: 'Which builds get it'
        type: choice
        options: [both, preview, production]
        default: both
      message:
        description: 'What changed (shown in the Expo dashboard)'
        required: true
      live_engine:
        description: 'Which system NEW lives start on (running lives keep theirs)'
        type: choice
        options: [agora, livekit]
        default: agora

concurrency:
  group: ota-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    # What the builds bundle with, so an update does not lose it:
    #  - the public values the build profiles set in eas.json (`eas update`
    #    does not read a build profile's env);
    #  - the EAS environment of each channel's builds (--environment below),
    #    which holds EXPO_PUBLIC_AGORA_APP_ID for calls and walkie-talkie;
    #  - the Maps key, only so app.config.js keeps extra.mapsKeyConfigured
    #    true (the map would fall back to its placeholder otherwise).
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://vfkwipvinmnybilcrdzr.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_dgWbaJlmKOgP3VDEriA7Lg_LDHOiomD
      # New lives on Agora or FLYP's own LiveKit server (0166, features/live/config.ts).
      EXPO_PUBLIC_LIVE_ENGINE: ${{ inputs.live_engine || 'agora' }}
      GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # The Android fingerprint includes this file's contents, so the update
      # needs the same file the builds use (not committed: the repo is public).
      - name: Write google-services.json
        env:
          CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$CONTENT" || { echo "Repository secret GOOGLE_SERVICES_JSON is missing"; exit 1; }
          printf '%s' "$CONTENT" > "$RUNNER_TEMP/google-services.json"
          echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"

      - name: Native fingerprints
        run: |
          fp() { npx expo-updates fingerprint:generate --platform "$1" | node -p 'JSON.parse(require("fs").readFileSync(0)).hash'; }
          echo "Android fingerprint: \`$(fp android)\`" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "iOS fingerprint: \`$(FLYP_IOS_COMM_NOTIFS="$COMM" fp ios)\`" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          COMM: ${{ vars.FLYP_IOS_COMM_NOTIFS }}

      - name: Publish to preview (Android test builds)
        if: inputs.channels == 'both' || inputs.channels == 'preview'
        run: eas update --channel preview --environment preview --platform android --message "$MESSAGE" --non-interactive
        env:
          MESSAGE: ${{ inputs.message }}

      # The store builds: TestFlight (iOS) and the Google Play AAB (Android)
      # both listen on "production". (Until Nov 2026 this step published iOS
      # only, so Play builds never got updates.)
      - name: Publish to production (TestFlight and Play builds)
        if: inputs.channels == 'both' || inputs.channels == 'production'
        run: |
          FLYP_IOS_COMM_NOTIFS="$COMM" eas update --channel production --environment production --platform ios --message "$MESSAGE" --non-interactive
          eas update --channel production --environment production --platform android --message "$MESSAGE" --non-interactive
        env:
          MESSAGE: ${{ inputs.message }}
          # Same value as the TestFlight build (it changes the iOS fingerprint).
          COMM: ${{ vars.FLYP_IOS_COMM_NOTIFS }}
