name: iOS build & TestFlight upload (Capacitor)

# Triggers:
#   - Push a tag like v1.0.0 → release build → TestFlight upload
#   - Manual run from GitHub UI with "upload" toggle
#   - Push to main → unsigned build (verification only)
#
# Required GitHub secrets (Settings → Secrets → Actions):
#   APPLE_TEAM_ID                 — your 10-char Team ID from developer.apple.com
#   APP_STORE_CONNECT_KEY_ID      — Key ID from App Store Connect → Users and Access → Keys
#   APP_STORE_CONNECT_ISSUER_ID   — Issuer ID on the same page
#   APP_STORE_CONNECT_KEY_BASE64  — base64 of the .p8 file you downloaded
#
# To base64 the .p8 file on Windows PowerShell:
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("C:\path\AuthKey_XXXXX.p8"))

# MANUAL ONLY, deliberately.
#
# GitHub bills a macOS runner at TEN TIMES a Linux one. In September this
# workflow ran 53 times for about 134 minutes of real work and was charged
# roughly 1,343 minutes - 84% of the account's entire 2,000-minute monthly
# allowance - while Android's 47 runs cost 261. The allowance ran out on the
# 18th and BOTH platforms stopped building, Android included, for want of
# minutes iOS had spent.
#
# Tagging a release no longer starts an iPhone build. Most tags are Android
# fixes and never needed one. Start this by hand when a TestFlight drop is
# actually wanted: Actions -> this workflow -> Run workflow -> pick the tag.
# Choosing a tag is what turns the upload on (DO_UPLOAD below reads the ref),
# so a run against a branch still builds and verifies without uploading.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to TestFlight (a tag ref uploads anyway)'
        required: false
        type: boolean
        default: true

jobs:
  build:
    # macos-14 only carries Xcode 16.x, whose newest SDK is iOS 18.2, and
    # App Store Connect now refuses anything built below the iOS 26 SDK.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # iOS ONLY. Android stays com.flyp.app - testers have that installed and
      # changing an applicationId makes it a different app to Play and to
      # every phone it is already on. The two platforms do not have to match,
      # and PRODUCT_BUNDLE_IDENTIFIER below overrides whatever `cap add ios`
      # generated from capacitor.config.json.
      BUNDLE_ID: com.flyp.social
      APP_NAME: 'FLYP'
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DO_UPLOAD: ${{ github.event.inputs.upload == 'true' || startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v4

      # GitHub rotates Xcode versions off the macOS images without warning, and
      # a hard-pinned path fails the whole run about 25 seconds in - which is
      # what every iOS run did before this. Take the newest that is actually
      # installed, and print the list so a future failure says why.
      - name: Select the newest installed Xcode
        run: |
          echo "Xcodes present on this runner:"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (none found)"
          XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "No Xcode on the runner"; exit 1; fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Add iOS platform (Capacitor)
        run: npx cap add ios

      # The bundle id belongs to the App target, not to every framework in the
      # workspace. Passing PRODUCT_BUNDLE_IDENTIFIER to xcodebuild applied it
      # to all twelve targets, so the Pods frameworks embedded inside App.app
      # each carried com.flyp.social too and the upload was rejected:
      #
      #   CFBundleIdentifier Collision. There is more than one bundle with the
      #   CFBundleIdentifier value 'com.flyp.social' under the iOS application
      #
      # App.xcodeproj is generated fresh by `cap add ios` from the appId in
      # capacitor.config.json, which is com.flyp.app because ANDROID uses that
      # and must keep it. So rewrite it here, in the App project only - the
      # Pods live in a separate Pods.xcodeproj and are never touched.
      # `cap add ios` regenerates the whole Xcode project on every run, icons
      # included, so the app shipped with Capacitor's placeholder icon while
      # Android had the real one. Apple rejects placeholder icons, and the
      # difference is visible on the store listing either way.
      #
      # Android's icons live in android/app/src/main/res and are committed, so
      # they survive. iOS has nothing to survive into - the project did not
      # exist a minute earlier - so the asset catalogue is copied in here.
      #
      # Verified rather than assumed: Contents.json lists 18 entries and every
      # filename it names must exist, or Xcode silently ships a partial set and
      # the icon is missing at some sizes only.
      - name: Install the app icons
        run: |
          SRC=resources/ios/AppIcon.appiconset
          DEST=ios/App/App/Assets.xcassets/AppIcon.appiconset
          if [ ! -d "$SRC" ]; then
            echo "::error::$SRC is missing - the build would ship Capacitor's placeholder icon"
            exit 1
          fi
          rm -rf "$DEST"
          mkdir -p "$(dirname "$DEST")"
          cp -R "$SRC" "$DEST"
          echo "Installed $(ls "$DEST" | wc -l | tr -d ' ') files:"
          ls "$DEST"
          # Every filename Contents.json names must actually exist, or Xcode
          # ships a partial set and the icon is missing at some sizes only.
          # Checked against the catalogue rather than against a guessed name:
          # hard-coding AppIcon-1024.png failed a build, because the 1024px
          # marketing icon is conventionally AppIcon-512@2x.png - 512pt at @2x.
          MISSING=0
          for f in $(sed -n 's/.*"filename"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$DEST/Contents.json"); do
            if [ ! -f "$DEST/$f" ]; then
              echo "::error::Contents.json references $f but it is not in the icon set"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then exit 1; fi
          # The marketing icon is what App Store Connect displays and what
          # Apple rejects hardest. It is 1024x1024 however it is named.
          BIG=$(find "$DEST" -name '*.png' -exec sh -c 'sips -g pixelWidth "$1" 2>/dev/null | grep -q "pixelWidth: 1024" && echo "$1"' _ {} \; | head -1)
          if [ -z "$BIG" ]; then
            echo "::error::No 1024x1024 marketing icon found in the icon set"
            exit 1
          fi
          echo "marketing icon: $BIG"
          echo "all $(ls "$DEST"/*.png | wc -l | tr -d ' ') icon files present"

      # `cap add ios` regenerates the project every run, and the template it
      # copies ships Capacitor's own placeholder splash - the pale blue X on
      # white that testers were seeing on every launch and reasonably read as
      # the wrong app. Same treatment as the icons above: our asset, installed
      # over the template's, and a loud failure rather than a silent placeholder.
      - name: Install the splash screen
        run: |
          SRC=resources/ios/Splash.imageset
          DEST=ios/App/App/Assets.xcassets/Splash.imageset
          if [ ! -d "$SRC" ]; then
            echo "::error::$SRC is missing - the build would ship Capacitor's placeholder splash"
            exit 1
          fi
          rm -rf "$DEST"
          mkdir -p "$(dirname "$DEST")"
          cp -R "$SRC" "$DEST"
          for f in $(sed -n 's/.*"filename"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$DEST/Contents.json"); do
            if [ ! -f "$DEST/$f" ]; then
              echo "::error::Contents.json references $f but it is not in the splash set"
              exit 1
            fi
          done
          echo "Installed splash: $(ls "$DEST" | tr '\n' ' ')"

      - name: Set the iOS bundle identifier on the App target
        run: |
          PBX=ios/App/App.xcodeproj/project.pbxproj
          CURRENT=$(grep -m1 -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*;' "$PBX" || true)
          echo "before: $CURRENT"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${{ env.BUNDLE_ID }};/g" "$PBX"
          echo "after:"
          grep -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*;' "$PBX" | sort -u
          # Fail loudly rather than archiving something signed for the wrong id.
          if ! grep -q "PRODUCT_BUNDLE_IDENTIFIER = ${{ env.BUNDLE_ID }};" "$PBX"; then
            echo "::error::Could not set the bundle identifier in $PBX"
            exit 1
          fi

      - name: Sync web assets to iOS project
        run: npx cap sync ios

      # cap sync copies the entire webDir, so developer docs end up inside the
      # IPA - README.md carries a localhost URL and the word "staging". Nothing
      # in the app points at them, but they have no business in a shipped
      # binary. Removed from the COPY only; web/ itself is untouched.
      - name: Strip developer docs from the app bundle
        run: |
          PUB="ios/App/App/public"
          [ -d "$PUB" ] || { echo "::warning::$PUB missing"; exit 0; }
          rm -f "$PUB"/*.md "$PUB"/vercel.json "$PUB"/.vercelignore 2>/dev/null || true
          rm -rf "$PUB/tools" 2>/dev/null || true
          # Test the OUTPUT, not the pipeline's exit status: that comes from
          # `head`, which succeeds whether or not grep matched anything, so the
          # warning used to fire on every single run.
          LEFT="$(grep -rIl "127\.0\.0\.1\|localhost" "$PUB" 2>/dev/null | grep -v '/vendor/' | head -5 || true)"
          if [ -n "$LEFT" ]; then
            echo "$LEFT"
            echo "::warning::a localhost string still remains in the bundle (listed above)"
          else
            echo "verified: no localhost/127.0.0.1 left in the shipped bundle"
          fi

      # Apple's privacy manifest. Required since 1 May 2024 for any app that
      # uses a "required reason" API - Capacitor keeps bridge state in
      # UserDefaults and its camera/filesystem plugins read file timestamps.
      # Missing it earns ITMS-91053 and can be rejected under 5.1.1.
      #
      # Added with the xcodeproj gem, which CocoaPods already depends on, so it
      # is present on the runner. Deliberately NEVER fails the build: a missing
      # manifest is a warning from Apple, a corrupted pbxproj is a dead build.
      - name: Install the privacy manifest
        run: |
          set -o pipefail
          SRC="resources/ios/PrivacyInfo.xcprivacy"
          DST="ios/App/App/PrivacyInfo.xcprivacy"
          if [ ! -f "$SRC" ]; then
            echo "::warning::$SRC missing - no privacy manifest in this build"
            exit 0
          fi
          plutil -lint "$SRC" || { echo "::warning::privacy manifest is not valid plist - skipping"; exit 0; }
          cp "$SRC" "$DST"

          ruby -e '
            begin
              require "xcodeproj"
            rescue LoadError
              system("gem install xcodeproj --no-document") or abort("no xcodeproj gem")
              require "xcodeproj"
            end
            proj = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = proj.targets.find { |t| t.name == "App" } or abort("no App target")
            already = target.resources_build_phase.files.any? do |f|
              f.file_ref && f.file_ref.path.to_s.include?("PrivacyInfo.xcprivacy")
            end
            if already
              puts "privacy manifest already in Copy Bundle Resources"
            else
              group = proj.main_group.find_subpath("App", true)
              ref = group.new_reference("PrivacyInfo.xcprivacy")
              target.add_resources([ref])
              proj.save
              puts "privacy manifest added to the App target"
            end
          ' || echo "::warning::could not add the privacy manifest to the project - continuing"

          # Say plainly whether it actually landed, rather than trusting the
          # script above. A patch that reports success it did not achieve has
          # cost this project two builds already.
          if grep -q "PrivacyInfo.xcprivacy" "ios/App/App.xcodeproj/project.pbxproj"; then
            echo "verified: PrivacyInfo.xcprivacy is referenced by the project"
          else
            echo "::warning::PrivacyInfo.xcprivacy is NOT referenced by the project"
          fi

      - name: Set Team ID + Bundle ID in Xcode project
        run: |
          PROJ="ios/App/App.xcodeproj/project.pbxproj"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName FLYP" "ios/App/App/Info.plist" 2>/dev/null || true
          # Permission strings. ENGLISH FIRST, then Arabic - both in one string.
          #
          # Apple rejected 1.0 under guideline 5.1.1 with a screenshot of the
          # camera prompt reading "نحتاج الكاميرا لتسجيل الفيديوهات" on an English
          # device. A purpose string the reader cannot understand is not a
          # purpose string.
          #
          # Deliberately NOT .lproj localisation: that can silently fail to be
          # picked up - wrong folder, not in the target, region not declared -
          # and the failure looks identical to this rejection. One bilingual
          # string cannot fail to display, and an Arabic reader still gets
          # Arabic in the same dialog.
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'FLYP uses the camera so you can record videos and go live. يستخدم FLYP الكاميرا لتسجيل الفيديوهات والبث المباشر.'" "ios/App/App/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'FLYP uses the camera so you can record videos and go live. يستخدم FLYP الكاميرا لتسجيل الفيديوهات والبث المباشر.'" "ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'FLYP uses the microphone to record sound in your videos, for voice messages, and for calls. يستخدم FLYP الميكروفون لتسجيل الصوت والرسائل الصوتية والمكالمات.'" "ios/App/App/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'FLYP uses the microphone to record sound in your videos, for voice messages, and for calls. يستخدم FLYP الميكروفون لتسجيل الصوت والرسائل الصوتية والمكالمات.'" "ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'FLYP needs access to your photos so you can choose a video or picture to post or send. يحتاج FLYP إلى صورك لاختيار مقطع أو صورة لنشرها أو إرسالها.'" "ios/App/App/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'FLYP needs access to your photos so you can choose a video or picture to post or send. يحتاج FLYP إلى صورك لاختيار مقطع أو صورة لنشرها أو إرسالها.'" "ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'FLYP saves photos and videos you download to your library. يحفظ FLYP الصور والفيديوهات التي تنزلها في مكتبتك.'" "ios/App/App/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'FLYP saves photos and videos you download to your library. يحفظ FLYP الصور والفيديوهات التي تنزلها في مكتبتك.'" "ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'FLYP uses your location only to show you on the friends map, and only while you choose to share it. يستخدم FLYP موقعك لعرضك على خريطة الأصدقاء فقط عندما تختار مشاركته.'" "ios/App/App/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'FLYP uses your location only to show you on the friends map, and only while you choose to share it. يستخدم FLYP موقعك لعرضك على خريطة الأصدقاء فقط عندما تختار مشاركته.'" "ios/App/App/Info.plist"

      # Read the permission strings back OUT of the plist that was just
      # written. Apple rejected 1.0 under 5.1.1 because these were Arabic-only
      # on an English device; this prints what the built app actually carries,
      # so the fix is checkable from the log without a phone.
      - name: Show the permission strings that shipped
        run: |
          PL="ios/App/App/Info.plist"
          echo "--- purpose strings in the built app ---"
          for K in NSCameraUsageDescription NSMicrophoneUsageDescription                    NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription                    NSLocationWhenInUseUsageDescription; do
            V="$(/usr/libexec/PlistBuddy -c "Print :$K" "$PL" 2>/dev/null || echo '(MISSING)')"
            echo "$K:"
            echo "    $V"
            case "$V" in
              FLYP*) : ;;
              *) echo "::warning::$K does not start with English text" ;;
            esac
          done

      # Sign in with Apple needs an entitlement on the app target, and the
      # matching capability on the App ID. `cap add ios` regenerates the Xcode
      # project every run, so both are written here rather than committed.
      # Automatic signing plus -allowProvisioningUpdates then issues a profile
      # that carries the capability.
      - name: Enable Sign in with Apple capability
        run: |
          ENT="ios/App/App/App.entitlements"
          cat > "$ENT" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.applesignin</key>
            <array>
              <string>Default</string>
            </array>
            <!-- Push notifications. 'production' is right for TestFlight and
                 the App Store; Xcode swaps in 'development' for debug runs. -->
            <key>aps-environment</key>
            <string>production</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$ENT"
          # PRODUCT_BUNDLE_IDENTIFIER appears only in the App target's build
          # configurations, which makes it a reliable anchor in a generated
          # pbxproj.
          PROJ="ios/App/App.xcodeproj/project.pbxproj"
          python3 - "$PROJ" <<'PY'
          import re, sys
          path = sys.argv[1]
          src = open(path, encoding='utf-8').read()
          if 'CODE_SIGN_ENTITLEMENTS' in src:
              print('Entitlements already wired; leaving as is.')
          else:
              src, n = re.subn(
                  r'(\n(\s*)PRODUCT_BUNDLE_IDENTIFIER = )',
                  lambda m: '\n%sCODE_SIGN_ENTITLEMENTS = App/App.entitlements;%s' % (m.group(2), m.group(1)),
                  src)
              if not n:
                  sys.exit('Could not find PRODUCT_BUNDLE_IDENTIFIER in the pbxproj')
              open(path, 'w', encoding='utf-8').write(src)
              print('Wired entitlements into %d build configuration(s).' % n)
          PY

      - name: Pod install
        working-directory: ios/App
        run: pod install --repo-update

      # @capacitor/push-notifications needs two AppDelegate callbacks to hand
      # the APNs device token (or the failure) to the Capacitor bridge. `cap
      # add ios` regenerates AppDelegate.swift on every run, so they are
      # written in here rather than committed. Without them register() never
      # resolves and no iPhone ever gets a token.
      - name: Wire push registration into AppDelegate
        run: |
          python3 - <<'PY'
          p = 'ios/App/App/AppDelegate.swift'
          s = open(p).read()
          if 'didRegisterForRemoteNotificationsWithDeviceToken' not in s:
              # Built line by line: a Swift line at column 4 would end this
              # YAML block scalar early ("mapping values are not allowed here").
              hooks = '\n'.join([
                  '',
                  '    // Push notifications: hand the token / the failure to the Capacitor bridge.',
                  '    func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {',
                  '        NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)',
                  '    }',
                  '',
                  '    func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {',
                  '        NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)',
                  '    }',
                  '',
              ])
              i = s.rfind('}')          # the class's closing brace
              s = s[:i] + hooks + s[i:]
              open(p, 'w').write(s)
          ok = 'didRegisterForRemoteNotificationsWithDeviceToken' in open(p).read()
          print('AppDelegate push hooks:', 'present' if ok else 'MISSING')
          if not ok: raise SystemExit(1)
          PY

      - name: Decode App Store Connect API key
        if: env.DO_UPLOAD == 'true'
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}" | base64 --decode > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      # ── The certificate ──
      # Apple issues signing certificates PER MACHINE, and the private key
      # stays on the machine that made the request. A GitHub runner is a fresh
      # machine every single run, so it holds no key for any certificate the
      # account already has - which is exactly what the build said:
      #
      #   "Your account already has an Apple Development signing certificate
      #    for this machine, but its private key is not installed in your
      #    keychain. Xcode can create a new one after revoking your existing
      #    certificate."
      #
      # Xcode will not revoke somebody's certificate unattended, and Apple caps
      # development certificates at 2, so -allowProvisioningUpdates cannot dig
      # its way out. No amount of build-setting tuning fixes this; the runner
      # needs an actual certificate. Importing one also leaves the developer's
      # own certificates alone, which revoking would not.
      #
      # The keychain is created fresh and left unlocked for the job only. It
      # dies with the runner.
      - name: Install the signing certificate
        if: env.DO_UPLOAD == 'true'
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          DEV_CERT_B64: ${{ secrets.IOS_DEV_CERT_P12_BASE64 }}
          DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          # Optional. With no certificate supplied, fall through and let
          # -allowProvisioningUpdates create one, which works as long as the
          # account is under Apple's 2-development-certificate cap. Supplying
          # one is the durable fix, because CI creating a certificate per run
          # fills that cap again; but a missing secret must not fail a build
          # that would otherwise have succeeded.
          #
          # TWO certificates, because the two halves of this job sign with
          # different ones. The ARCHIVE below signs for development (see the
          # comment at the xcodebuild step - pinning it to distribution breaks
          # every Pod), and the EXPORT re-signs for distribution. Supplying only
          # the distribution half therefore left the archive still asking Apple
          # for a fresh development certificate on every run, which is what
          # filled the 2-certificate cap four times. IOS_DEV_CERT_P12_BASE64 is
          # the half that actually stops it.
          if [ -z "$CERT_B64" ] && [ -z "$DEV_CERT_B64" ]; then
            echo "::notice::No signing certificate secrets; letting Xcode create one instead."
            exit 0
          fi
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # -A lets codesign use the key without prompting, which matters
          # because there is nobody at the runner to click Allow.
          import_p12() {
            local b64="$1" pw="$2" label="$3"
            [ -z "$b64" ] && { echo "::notice::no $label certificate supplied"; return 0; }
            echo "$b64" | base64 --decode > $RUNNER_TEMP/cert.p12
            security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" \
              -P "$pw" -T /usr/bin/codesign -T /usr/bin/security -A
            rm -f $RUNNER_TEMP/cert.p12
            echo "imported the $label certificate"
          }
          import_p12 "$DEV_CERT_B64" "$DEV_CERT_PASSWORD" "development"
          import_p12 "$CERT_B64" "$CERT_PASSWORD" "distribution"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Put it FIRST in the search list, ahead of the runner's login
          # keychain, or codesign looks in the wrong place and reports the
          # identity as missing.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

          echo "Identities now available to codesign:"
          security find-identity -v -p codesigning "$KEYCHAIN"
          # A development identity here is the whole point: without one the
          # archive asks Apple for a new certificate and the cap fills again.
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Development"; then
            echo "::warning::No Apple Development identity in the keychain - the archive will ask Apple for a new certificate and may hit the 2-certificate cap. Set IOS_DEV_CERT_P12_BASE64 and IOS_DEV_CERT_PASSWORD."
          fi

      # Without this every single upload sits at "Missing Compliance" in
      # App Store Connect until somebody answers the encryption question by
      # hand, and the build cannot be attached to a version until they do.
      # FLYP only talks HTTPS to Supabase, Agora and Cloudflare and implements
      # no cryptography of its own, which is the standard exemption - so the
      # answer is the same on every build and belongs in the plist.
      - name: Declare export compliance (HTTPS only)
        run: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false"             "ios/App/App/Info.plist" 2>/dev/null             || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false"             "ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "ios/App/App/Info.plist"

      # Two different numbers, and only one of them was ever set.
      #
      # CFBundleVersion is the build number — unique per upload, nobody reads it.
      # CFBundleShortVersionString is the VERSION: what a tester sees, and what
      # App Store Connect calls a "train". It was never written here, so it kept
      # Capacitor's default of 1.0 and every build went up as version 1.0. Apple
      # eventually closed that train and started refusing uploads outright:
      #   90062  This bundle is invalid. The value for key CFBundleShortVersionString [1.0]
      #   90186  Invalid Pre-Release Train. The train version '1.0' is closed
      # Take the version from the tag — refs/tags/v1.4.9 gives 1.4.9 — so the
      # tag, the app and TestFlight can never disagree again.
      - name: Set the version and build number
        if: env.DO_UPLOAD == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # A manual run sits on a branch, not a tag, and a branch name is not a
          # version. Fall back to the one the app itself reports.
          case "$VERSION" in
            [0-9]*.[0-9]*) ;;
            *) VERSION=$(grep -oE "appVersion = '[0-9][0-9.]*'" web/js/config.js | grep -oE "[0-9][0-9.]*" | head -1) ;;
          esac
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine a version for CFBundleShortVersionString"
            exit 1
          fi
          BUILD_NUM=$(date +%s)
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" "ios/App/App/Info.plist"
          echo "Version: $VERSION   Build number: $BUILD_NUM"

      # Do NOT pin CODE_SIGN_IDENTITY here. With CODE_SIGN_STYLE=Automatic,
      # Xcode refuses a manually specified identity ("conflicting provisioning
      # settings"), and because command-line build settings apply to EVERY
      # target it breaks all ten Pods as well, not just App.
      #
      # The archive being development-signed is normal and fine: the export
      # step below re-signs it for distribution using method=app-store. What
      # actually has to exist is the App ID and a certificate Xcode is allowed
      # to create - see the note on the export step.
      - name: Build archive (signed for App Store)
        if: env.DO_UPLOAD == 'true'
        working-directory: ios/App
        run: |
          # Without this the pipe to `tee` below reports TEE's exit code, so a
          # failed xcodebuild shows as a green step and the failure surfaces
          # later as "archive not found" - which is what happened, and it sent
          # us looking at the wrong step twice.
          set -o pipefail
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Automatic \
            archive | tee /tmp/xcodebuild.log

      - name: Export IPA
        if: env.DO_UPLOAD == 'true'
        working-directory: ios/App
        run: |
          cat > /tmp/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/ipa \
            -exportOptionsPlist /tmp/exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Build (verification, no codesign)
        if: env.DO_UPLOAD != 'true'
        working-directory: ios/App
        run: |
          # Without this the pipe to `tee` below reports TEE's exit code, so a
          # failed xcodebuild shows as a green step and the failure surfaces
          # later as "archive not found" - which is what happened, and it sent
          # us looking at the wrong step twice.
          set -o pipefail
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath $RUNNER_TEMP/derived \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/xcodebuild.log

      # The verification build above produces a SIMULATOR app and then throws
      # it away. Keep it: dropped into a browser-based iOS simulator it runs
      # the real UIKit date picker and real WebKit, which is the only way to
      # check the iOS-specific fixes without owning an iPhone.
      - name: Upload the simulator app for browser testing
        if: env.DO_UPLOAD != 'true'
        run: |
          APP="$(find "$RUNNER_TEMP/derived/Build/Products" -name 'App.app' -maxdepth 3 | head -1)"
          if [ -z "$APP" ]; then
            echo "::warning::no simulator App.app found - nothing to upload"
            exit 0
          fi
          echo "found $APP"
          cd "$(dirname "$APP")"
          zip -qry "$RUNNER_TEMP/FLYP-simulator.zip" App.app
          echo "zipped $(du -h "$RUNNER_TEMP/FLYP-simulator.zip" | cut -f1)"

      - name: Attach the simulator app
        if: env.DO_UPLOAD != 'true'
        continue-on-error: true          # a full artifact quota must not fail the run
        uses: actions/upload-artifact@v4
        with:
          name: flyp-simulator-app
          path: ${{ runner.temp }}/FLYP-simulator.zip
          if-no-files-found: warn

      - name: Upload IPA artifact
        continue-on-error: true          # TestFlight is the real delivery; storage is a bonus
        if: env.DO_UPLOAD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        if: env.DO_UPLOAD == 'true'
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/ipa/App.ipa" \
            --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      # Print the failure where it can always be read. The artifact upload
      # below is best-effort: it silently stops working the moment the
      # repository's artifact storage fills up, which is exactly when a build
      # starts failing and the log matters most.
      - name: Show why the build failed
        if: failure()
        run: |
          LOG=/tmp/xcodebuild.log
          if [ ! -s "$LOG" ]; then
            echo "no xcodebuild log was produced - the failure happened before xcodebuild ran"
            exit 0
          fi
          echo "=============== signing / provisioning lines ==============="
          grep -niE "error:|provisioning|signing certificate|No profiles|no signing|does not (contain|support)|Team ID|entitlement|revoked|limit" "$LOG"             | tail -40 || echo "(no matching lines)"
          echo
          echo "=============== last 60 lines of xcodebuild ==============="
          tail -60 "$LOG"

      - name: Upload xcodebuild log on failure
        if: failure()
        continue-on-error: true          # a full artifact quota must not mask the real error
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: ignore
