name: iOS build & TestFlight upload (Capacitor)

# Triggers:
#   - Push a tag like v1.0.0 → release build → TestFlight upload
#   - Manual run from GitHub UI with "upload" toggle
#   - Push to main → unsigned build (verification only)
#
# Required GitHub secrets (Settings → Secrets → Actions):
#   APPLE_TEAM_ID                 — your 10-char Team ID from developer.apple.com
#   APP_STORE_CONNECT_KEY_ID      — Key ID from App Store Connect → Users and Access → Keys
#   APP_STORE_CONNECT_ISSUER_ID   — Issuer ID on the same page
#   APP_STORE_CONNECT_KEY_BASE64  — base64 of the .p8 file you downloaded
#
# To base64 the .p8 file on Windows PowerShell:
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("C:\path\AuthKey_XXXXX.p8"))

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to TestFlight'
        required: false
        type: boolean
        default: false

jobs:
  build:
    # macos-14 only carries Xcode 16.x, whose newest SDK is iOS 18.2, and
    # App Store Connect now refuses anything built below the iOS 26 SDK.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # iOS ONLY. Android stays com.flyp.app - testers have that installed and
      # changing an applicationId makes it a different app to Play and to
      # every phone it is already on. The two platforms do not have to match,
      # and PRODUCT_BUNDLE_IDENTIFIER below overrides whatever `cap add ios`
      # generated from capacitor.config.json.
      BUNDLE_ID: com.flyp.social
      APP_NAME: 'FLYP'
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DO_UPLOAD: ${{ github.event.inputs.upload == 'true' || startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v4

      # GitHub rotates Xcode versions off the macOS images without warning, and
      # a hard-pinned path fails the whole run about 25 seconds in - which is
      # what every iOS run did before this. Take the newest that is actually
      # installed, and print the list so a future failure says why.
      - name: Select the newest installed Xcode
        run: |
          echo "Xcodes present on this runner:"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (none found)"
          XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "No Xcode on the runner"; exit 1; fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Add iOS platform (Capacitor)
        run: npx cap add ios

      # The bundle id belongs to the App target, not to every framework in the
      # workspace. Passing PRODUCT_BUNDLE_IDENTIFIER to xcodebuild applied it
      # to all twelve targets, so the Pods frameworks embedded inside App.app
      # each carried com.flyp.social too and the upload was rejected:
      #
      #   CFBundleIdentifier Collision. There is more than one bundle with the
      #   CFBundleIdentifier value 'com.flyp.social' under the iOS application
      #
      # App.xcodeproj is generated fresh by `cap add ios` from the appId in
      # capacitor.config.json, which is com.flyp.app because ANDROID uses that
      # and must keep it. So rewrite it here, in the App project only - the
      # Pods live in a separate Pods.xcodeproj and are never touched.
      # `cap add ios` regenerates the whole Xcode project on every run, icons
      # included, so the app shipped with Capacitor's placeholder icon while
      # Android had the real one. Apple rejects placeholder icons, and the
      # difference is visible on the store listing either way.
      #
      # Android's icons live in android/app/src/main/res and are committed, so
      # they survive. iOS has nothing to survive into - the project did not
      # exist a minute earlier - so the asset catalogue is copied in here.
      #
      # Verified rather than assumed: Contents.json lists 18 entries and every
      # filename it names must exist, or Xcode silently ships a partial set and
      # the icon is missing at some sizes only.
      - name: Install the app icons
        run: |
          SRC=resources/ios/AppIcon.appiconset
          DEST=ios/App/App/Assets.xcassets/AppIcon.appiconset
          if [ ! -d "$SRC" ]; then
            echo "::error::$SRC is missing - the build would ship Capacitor's placeholder icon"
            exit 1
          fi
          rm -rf "$DEST"
          mkdir -p "$(dirname "$DEST")"
          cp -R "$SRC" "$DEST"
          echo "Installed $(ls "$DEST" | wc -l | tr -d ' ') files:"
          ls "$DEST"
          # The 1024 marketing icon is the one App Store Connect displays and
          # the one Apple rejects hardest if it is wrong or has transparency.
          if [ ! -f "$DEST/AppIcon-1024.png" ]; then
            echo "::error::AppIcon-1024.png missing from the icon set"
            exit 1
          fi

      - name: Set the iOS bundle identifier on the App target
        run: |
          PBX=ios/App/App.xcodeproj/project.pbxproj
          CURRENT=$(grep -m1 -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*;' "$PBX" || true)
          echo "before: $CURRENT"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${{ env.BUNDLE_ID }};/g" "$PBX"
          echo "after:"
          grep -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*;' "$PBX" | sort -u
          # Fail loudly rather than archiving something signed for the wrong id.
          if ! grep -q "PRODUCT_BUNDLE_IDENTIFIER = ${{ env.BUNDLE_ID }};" "$PBX"; then
            echo "::error::Could not set the bundle identifier in $PBX"
            exit 1
          fi

      - name: Sync web assets to iOS project
        run: npx cap sync ios

      - name: Set Team ID + Bundle ID in Xcode project
        run: |
          PROJ="ios/App/App.xcodeproj/project.pbxproj"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName FLYP" "ios/App/App/Info.plist" 2>/dev/null || true
          # Add permission strings (Apple requires these for any app that touches camera/mic/location)
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'نحتاج الكاميرا لتسجيل الفيديوهات'" "ios/App/App/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'نحتاج الكاميرا لتسجيل الفيديوهات'" "ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'نحتاج الميكروفون لتسجيل الصوت'" "ios/App/App/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'نحتاج الميكروفون لتسجيل الصوت'" "ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'لاختيار الفيديوهات والصور'" "ios/App/App/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'لاختيار الفيديوهات والصور'" "ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'لحفظ الفيديوهات إلى المكتبة'" "ios/App/App/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'لحفظ الفيديوهات إلى المكتبة'" "ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'لعرض موقع الأصدقاء على الخريطة'" "ios/App/App/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'لعرض موقع الأصدقاء على الخريطة'" "ios/App/App/Info.plist"

      - name: Pod install
        working-directory: ios/App
        run: pod install --repo-update

      - name: Decode App Store Connect API key
        if: env.DO_UPLOAD == 'true'
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}" | base64 --decode > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      # ── The certificate ──
      # Apple issues signing certificates PER MACHINE, and the private key
      # stays on the machine that made the request. A GitHub runner is a fresh
      # machine every single run, so it holds no key for any certificate the
      # account already has - which is exactly what the build said:
      #
      #   "Your account already has an Apple Development signing certificate
      #    for this machine, but its private key is not installed in your
      #    keychain. Xcode can create a new one after revoking your existing
      #    certificate."
      #
      # Xcode will not revoke somebody's certificate unattended, and Apple caps
      # development certificates at 2, so -allowProvisioningUpdates cannot dig
      # its way out. No amount of build-setting tuning fixes this; the runner
      # needs an actual certificate. Importing one also leaves the developer's
      # own certificates alone, which revoking would not.
      #
      # The keychain is created fresh and left unlocked for the job only. It
      # dies with the runner.
      - name: Install the signing certificate
        if: env.DO_UPLOAD == 'true'
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          # Optional. With no certificate supplied, fall through and let
          # -allowProvisioningUpdates create one, which works as long as the
          # account is under Apple's 2-development-certificate cap. Supplying
          # one is the durable fix, because CI creating a certificate per run
          # fills that cap again; but a missing secret must not fail a build
          # that would otherwise have succeeded.
          if [ -z "$CERT_B64" ]; then
            echo "::notice::No IOS_DIST_CERT_P12_BASE64 secret; letting Xcode create a certificate instead."
            exit 0
          fi
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_B64" | base64 --decode > $RUNNER_TEMP/cert.p12
          # -A lets codesign use the key without prompting, which matters
          # because there is nobody at the runner to click Allow.
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Put it FIRST in the search list, ahead of the runner's login
          # keychain, or codesign looks in the wrong place and reports the
          # identity as missing.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

          rm -f $RUNNER_TEMP/cert.p12
          echo "Identities now available to codesign:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Without this every single upload sits at "Missing Compliance" in
      # App Store Connect until somebody answers the encryption question by
      # hand, and the build cannot be attached to a version until they do.
      # FLYP only talks HTTPS to Supabase, Agora and Cloudflare and implements
      # no cryptography of its own, which is the standard exemption - so the
      # answer is the same on every build and belongs in the plist.
      - name: Declare export compliance (HTTPS only)
        run: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false"             "ios/App/App/Info.plist" 2>/dev/null             || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false"             "ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "ios/App/App/Info.plist"

      - name: Auto-increment build number
        if: env.DO_UPLOAD == 'true'
        run: |
          BUILD_NUM=$(date +%s)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" "ios/App/App/Info.plist"
          echo "Build number: $BUILD_NUM"

      # Do NOT pin CODE_SIGN_IDENTITY here. With CODE_SIGN_STYLE=Automatic,
      # Xcode refuses a manually specified identity ("conflicting provisioning
      # settings"), and because command-line build settings apply to EVERY
      # target it breaks all ten Pods as well, not just App.
      #
      # The archive being development-signed is normal and fine: the export
      # step below re-signs it for distribution using method=app-store. What
      # actually has to exist is the App ID and a certificate Xcode is allowed
      # to create - see the note on the export step.
      - name: Build archive (signed for App Store)
        if: env.DO_UPLOAD == 'true'
        working-directory: ios/App
        run: |
          # Without this the pipe to `tee` below reports TEE's exit code, so a
          # failed xcodebuild shows as a green step and the failure surfaces
          # later as "archive not found" - which is what happened, and it sent
          # us looking at the wrong step twice.
          set -o pipefail
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Automatic \
            archive | tee /tmp/xcodebuild.log

      - name: Export IPA
        if: env.DO_UPLOAD == 'true'
        working-directory: ios/App
        run: |
          cat > /tmp/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/ipa \
            -exportOptionsPlist /tmp/exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Build (verification, no codesign)
        if: env.DO_UPLOAD != 'true'
        working-directory: ios/App
        run: |
          # Without this the pipe to `tee` below reports TEE's exit code, so a
          # failed xcodebuild shows as a green step and the failure surfaces
          # later as "archive not found" - which is what happened, and it sent
          # us looking at the wrong step twice.
          set -o pipefail
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath $RUNNER_TEMP/derived \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/xcodebuild.log

      - name: Upload IPA artifact
        if: env.DO_UPLOAD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        if: env.DO_UPLOAD == 'true'
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/ipa/App.ipa" \
            --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
