name: Android build (Play Store AAB + side-load APK)

# Triggers:
#   - Every push to main → unsigned debug APK uploaded as artifact (smoke test only)
#   - Tag like v1.0.0 → signed RELEASE AAB + signed RELEASE APK (Play Store ready)
#   - Manual dispatch from GitHub UI
#
# Required GitHub secrets for the signed release builds (set in
#   Settings → Secrets and variables → Actions):
#
#   ANDROID_KEYSTORE_BASE64    — base64 of your upload-keystore.jks file
#   ANDROID_KEYSTORE_PASSWORD  — the keystore password
#   ANDROID_KEY_ALIAS          — alias of the upload key inside the keystore
#   ANDROID_KEY_PASSWORD       — the alias's password
#
# Generate the keystore once with keytool (see PLAY_STORE_CHECKLIST.md).
# If the secrets are NOT set, the release build falls back to a debug-
# signed APK so the workflow still completes — but those won't be
# accepted by Play Console.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Needed to create the tag's Release and attach the APK/AAB to it.
    # Everything else stays read-only.
    permissions:
      contents: write
    env:
      # Gradle 8.2.1 (see gradle-wrapper.properties) supports Java 19 at most.
      # On Java 21 it dies with "Unsupported class file major version 65".
      JAVA_VERSION: '17'
      NODE_VERSION: '20'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Was `uses: android-actions/setup-android@v3`. It broke on 2026-09-17
      # without anything changing on our side: the action looked at the runner's
      # preinstalled command-line tools (12.0), called them the "wrong version",
      # downloaded 16.0, and then failed accepting licences through the tools it
      # had just fetched —
      #   6 of 7 SDK package licenses not accepted.
      #   Error: .../cmdline-tools/16.0/bin/sdkmanager failed with exit code 1
      # and the whole job was over in 25 seconds.
      #
      # The runner image already ships a working SDK with its licences accepted,
      # so use that instead of fetching a second copy. `yes |` is belt and braces
      # for any package Gradle pulls in later; it cannot fail the job.
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"   >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          echo "SDK root: $ANDROID_SDK_ROOT"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --list_installed || true

      - name: Install npm dependencies
        run: npm install


      - name: Sync web assets to Android project
        run: npx cap sync android

      # Firebase's config for push notifications. Kept as a base64 secret,
      # exactly like the keystore. app/build.gradle applies the google-services
      # plugin only when this file exists, so a build without the secret still
      # succeeds - it just cannot receive pushes.
      - name: Install google-services.json (push notifications)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GS_B64" ]; then
            echo "::warning::No GOOGLE_SERVICES_JSON_BASE64 secret - building without push notifications"
            exit 0
          fi
          echo "$GS_B64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          import json
          d = json.load(open('android/app/google-services.json'))
          pkgs = [c['client_info']['android_client_info']['package_name'] for c in d.get('client', [])]
          print('google-services.json: project', d['project_info']['project_id'], 'packages', pkgs)
          if 'com.flyp.app' not in pkgs:
              raise SystemExit('::error::google-services.json is not for com.flyp.app')
          PY

      - name: Patch app name, versionCode, and permissions
        run: |
          BUILD_NUM=$(date +%s | tail -c 8)
          echo "VERSION_CODE=$BUILD_NUM" >> $GITHUB_ENV
          sed -i "s/versionCode 1/versionCode $BUILD_NUM/" android/app/build.gradle || true
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">FLYP</string>|' android/app/src/main/res/values/strings.xml || true
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">FLYP</string>|' android/app/src/main/res/values/strings.xml || true
          # Allow camera, mic, location, internet — Capacitor adds most by default but be explicit
          PERM_FILE=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.RECORD_AUDIO" $PERM_FILE; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />|' $PERM_FILE
          fi

      # ── Detect whether the user has uploaded a signing keystore ──
      # The workflow happily builds debug-signed artifacts even without
      # secrets, so first-time pushes don't fail. Play Console needs the
      # signed-with-real-keystore version produced by the tag path.
      - name: Detect signing secrets
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] \
             && [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] \
             && [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] \
             && [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "have_signing=true"  >> $GITHUB_OUTPUT
            echo "Signing secrets present — will produce a Play-Store-ready signed release."
          else
            echo "have_signing=false" >> $GITHUB_OUTPUT
            echo "::warning::No signing secrets — release builds will be unsigned. Add ANDROID_KEYSTORE_BASE64 + 3 password secrets for Play Console builds."
          fi

      - name: Decode upload keystore
        if: steps.signing.outputs.have_signing == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/upload-keystore.jks
          # Sanity-check that the decoded file is a real keystore
          if ! file $RUNNER_TEMP/upload-keystore.jks | grep -qi 'data\|Java KeyStore'; then
            echo "::error::Decoded keystore does not look like a JKS file. Did you base64-encode upload-keystore.jks correctly?"
            exit 1
          fi
          echo "Keystore decoded OK (size: $(stat -c%s $RUNNER_TEMP/upload-keystore.jks) bytes)"

      # ── Debug APK on every push (smoke test) ──
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      # ── Release AAB + APK on tag pushes (Play Store ready) ──
      - name: Build signed release AAB (Play Store)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.have_signing == 'true'
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$RUNNER_TEMP/upload-keystore.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Build signed release APK (side-load)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.have_signing == 'true'
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$RUNNER_TEMP/upload-keystore.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      # ── Fallback: unsigned release build if no secrets yet (so PR builds don't fail) ──
      - name: Build unsigned release APK (no keystore present)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.have_signing == 'false'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: List built artifacts
        run: |
          echo "=== Debug APKs ==="
          find android -name "*.apk" -path "*/debug/*" -exec ls -lh {} \;
          echo "=== Release APKs ==="
          find android -name "*.apk" -path "*/release/*" -exec ls -lh {} \; || true
          echo "=== Release AABs ==="
          find android -name "*.aab" -exec ls -lh {} \; || true

      # ── Artifacts ──
      #
      # Every upload below is `continue-on-error` on purpose. On 2026-09-17 a
      # build that had already produced a signed, Play-Store-ready AAB was
      # recorded as a FAILURE because of this alone:
      #
      #   Failed to CreateArtifact: Artifact storage quota has been hit.
      #
      # Nothing was wrong with the build; the account's artifact storage was
      # simply full. A finished build must not be thrown away because there is
      # nowhere to put a copy of it. The Release step below is the delivery
      # that matters — these are a convenience, and they expire.
      - name: Upload debug APK (every build)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: flyp-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload signed release AAB (Play Store)
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.have_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flyp-release-aab-${{ env.VERSION_CODE }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload signed release APK (side-load testing)
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.have_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flyp-release-apk-${{ env.VERSION_CODE }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload unsigned release APK (fallback, NOT for Play Store)
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.have_signing == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: flyp-release-apk-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # ── Delivery ──
      # Release assets are not charged against the Actions artifact quota and
      # they do not expire, so this is where a tagged build actually lands.
      # One permanent download link per version, instead of a copy that
      # vanishes in a month and stops being written at all once storage fills.
      - name: Attach the build to its GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          # Release outputs only. The debug APK lives under .../apk/debug/ and
          # is deliberately excluded: handing a tester two APKs, one of which
          # cannot be installed over the other, only causes confusion.
          FILES=$(find android/app/build/outputs \( -name '*.apk' -o -name '*.aab' \) -type f ! -path '*debug*' | sort)
          if [ -z "$FILES" ]; then
            echo "::error::Tag build produced no release APK or AAB to attach"
            exit 1
          fi
          echo "Attaching to $TAG:"
          echo "$FILES" | sed 's/^/  /'
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "FLYP $TAG" \
                 --notes "Automated build of $TAG (version code $VERSION_CODE). Side-load the .apk; the .aab is for Play Console."
          # --clobber so re-running a build replaces the assets rather than
          # failing on "asset already exists".
          gh release upload "$TAG" $FILES --clobber
          echo "RELEASE_URL=$(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_ENV"

      - name: Build summary
        if: always()
        run: |
          echo "## Android build summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Version code: \`${{ env.VERSION_CODE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Signing secrets present: \`${{ steps.signing.outputs.have_signing }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "$RELEASE_URL" ]; then
            echo "- 📦 Download: $RELEASE_URL" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.signing.outputs.have_signing }}" == "true" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "- ✅ Play-Store-ready AAB produced — attached to the Release above, upload the .aab to Play Console" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "- ⚠️  Tag build produced UNSIGNED APK — add keystore secrets for a Play-Store-ready build" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ℹ️  Push build produced debug APK only (push a tag like v1.0.0 for release artifacts)" >> $GITHUB_STEP_SUMMARY
          fi
