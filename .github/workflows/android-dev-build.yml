# Android test build of the FLYP app (mobile/): the standalone "preview"
# APK (JavaScript bundled in, no Metro needed), for phones and emulators, run on GitHub's
# runners instead of EAS's: public-repo runners have 16 GB of RAM, which the
# native libraries (Skia, vision-camera, reanimated) need to compile.
# The APK is attached to the run as an artifact.
#
# Needs the repository secret EXPO_TOKEN (expo.dev → Access tokens). EAS
# supplies the signing key and the environment variables, including the
# google-services.json file variable, for the "preview" environment.
name: Android test build

on:
  workflow_dispatch:
  push:
    branches: [feat/rn-phase1-foundation]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-dev-build.yml'

concurrency:
  group: android-dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Free disk space
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Not committed (public repo), and a local EAS build copies the project
      # without git-ignored files, so it is written outside the project and
      # app.config.js reads its path from GOOGLE_SERVICES_JSON.
      - name: Write google-services.json
        env:
          CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$CONTENT" || { echo "Repository secret GOOGLE_SERVICES_JSON is missing"; exit 1; }
          printf '%s' "$CONTENT" > "$RUNNER_TEMP/google-services.json"

      - name: Build APK
        env:
          GOOGLE_SERVICES_JSON: ${{ runner.temp }}/google-services.json
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Dorg.gradle.daemon=false
        run: eas build --local --profile preview --platform android --non-interactive --output ${{ github.workspace }}/flyp-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: flyp-test-apk
          path: flyp-test.apk
          retention-days: 14
