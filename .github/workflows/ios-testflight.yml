# iOS build of the FLYP app (mobile/) and upload to TestFlight, on GitHub's
# macOS runners (free for this public repo) instead of the EAS build queue.
#
# Signing and upload use the App Store Connect API key already stored as
# repository secrets (from the old Capacitor app), so no Apple ID login or
# two-factor prompt is needed: EAS creates or reuses the distribution
# certificate and provisioning profile through that key and keeps them on its
# servers, then `eas submit` uploads the .ipa to App Store Connect app
# 6807461188 (com.flyp.social).
#
# Secrets: EXPO_TOKEN, APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID,
# APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_BASE64 (the .p8, base64).
name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches: [feat/rn-phase1-foundation]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-testflight.yml'

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # Expo SDK 58 / React Native 0.88 need a recent Xcode: use the newest one
      # installed on the runner image.
      - name: Select newest Xcode
        working-directory: .
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # The .p8 never touches the repo: it is written to the runner's temp
      # folder for this job only.
      - name: Write App Store Connect API key
        env:
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          test -n "$KEY_B64" || { echo "Secret APP_STORE_CONNECT_KEY_BASE64 is missing"; exit 1; }
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/asc_api_key.p8"

      - name: Build IPA
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc_api_key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: COMPANY_OR_ORGANIZATION
          # Sender photos on message notifications (mobile/app.config.js).
          # Set the repository variable to 1 once "Communication
          # Notifications" is enabled for com.flyp.social in the Apple portal.
          FLYP_IOS_COMM_NOTIFS: ${{ vars.FLYP_IOS_COMM_NOTIFS }}
        run: eas build --platform ios --profile production --local --non-interactive --output ${{ github.workspace }}/flyp.ipa

      # eas submit only takes an App Store Connect key from eas.json when it runs
      # unattended, so the key's location and ids are added to the runner's copy
      # of eas.json here (never committed).
      - name: Point eas submit at the API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_PATH: ${{ runner.temp }}/asc_api_key.p8
        run: |
          node -e '
            const fs = require("fs");
            const e = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            e.submit.production.ios = { ...e.submit.production.ios, ascApiKeyPath: process.env.KEY_PATH, ascApiKeyId: process.env.KEY_ID, ascApiKeyIssuerId: process.env.ISSUER_ID };
            fs.writeFileSync("eas.json", JSON.stringify(e, null, 2));
          '

      - name: Upload to TestFlight
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc_api_key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: eas submit --platform ios --profile production --path ${{ github.workspace }}/flyp.ipa --non-interactive

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flyp-ios-ipa
          path: flyp.ipa
          if-no-files-found: ignore
          retention-days: 7
