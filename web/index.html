  <!-- Configure Agora App ID here, OR leave blank and live screens fall back to placeholder -->
  <!-- AUTO-CLEAR stale SW caches so fresh JS/CSS always loads -->
  <script>
    (function () {
      // Unregister every service worker on this origin
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
      }
      // Delete every cache entry
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        });
      }
    })();
  </script>
  <script>window.AGORA_APP_ID = '8d15ed4d11f84365aea8f1d78ee2c713';</script>
  <!-- Leaflet for real map tiles -->
